name: Build TV APK

on:
  push:
    branches: [ ci-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept all Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -alias debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Debug,O=Debug,C=US"

      - name: Create local.properties
        run: |
          echo "storeFile=debug.keystore" >> local.properties
          echo "keyAlias=debug" >> local.properties
          echo "storePassword=android" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK (leanback arm64)
        run: ./gradlew assembleLeanbackArm64_v8aDebug --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"

      - name: Build Debug APK (mobile arm64)
        run: ./gradlew assembleMobileArm64_v8aDebug --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"

      - name: Upload leanback APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-leanback-arm64-debug
          path: app/build/outputs/apk/leanbackArm64_v8a/debug/*.apk

      - name: Upload mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-mobile-arm64-debug
          path: app/build/outputs/apk/mobileArm64_v8a/debug/*.apk
